name: Deploy kinDay Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/package.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: ./web
        run: npm install

      - name: Build Next.js static export
        working-directory: ./web
        env:
          DEPLOY_TARGET: gh-pages
          NEXT_PUBLIC_SUPABASE_URL: "https://gnvimwprlfbhltmnibwt.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdudmltd3BybGZiaGx0bW5pYnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMzY5ODMsImV4cCI6MjEwOTYxMjk4M30.LvT6TI9p6yJvmW3BmjJrhnBKeNNynJsVlNZCgOfxk-A"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
